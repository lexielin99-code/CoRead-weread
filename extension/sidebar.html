<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>CoRead 共读</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      background: #fff;
      border-bottom: 1px solid #ececec;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #header .title { font-weight: 400; font-size: 12px; color: #888; flex: 1; letter-spacing: 0.01em; }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: #ddd; flex-shrink: 0; transition: background 0.3s; }
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #footer {
      background: #fff;
      border-top: 1px solid #ececec;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 36px;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
      color: #333;
      background: #fafafa;
    }
    #send-btn {
      background: #07c160;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      height: 36px;
      flex-shrink: 0;
      font-family: inherit;
    }
    #send-btn:hover { background: #06ad56; }
    .msg-annotation {
      background: #fff;
      border: 1px solid #e8f5e9;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }
    .msg-annotation .label { color: #07c160; font-weight: 600; }
    .msg-annotation .quote { margin-top: 6px; color: #555; font-style: italic; line-height: 1.5; }
    .msg-annotation .text { margin-top: 4px; color: #999; font-size: 11px; }
    .msg-annotation .user-note { margin-top: 6px; color: #07c160; font-style: normal; }
    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user .bubble {
      background: #07c160;
      color: #fff;
      border-radius: 14px 14px 2px 14px;
      padding: 9px 13px;
      max-width: 82%;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-assistant { display: flex; justify-content: flex-start; }
    .msg-assistant .bubble {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 14px 14px 14px 2px;
      padding: 9px 13px;
      max-width: 88%;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: #222;
    }
  </style>
</head>
<body>
  <div id="header">
    <span style="font-size:15px;line-height:1">📖</span>
    <span class="title"><em>We read to know we are not alone.</em></span>
    <span id="dot"></span>
  </div>
  <div id="msgs"></div>
  <div id="footer">
    <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
